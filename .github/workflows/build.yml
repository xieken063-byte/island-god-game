# 在 GitHub 上自动编译固件，产出可直接烧录的 island-full.bin。
# 运行完后，在这次运行页面底部的 Artifacts 里下载 island-firmware。
name: Build firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出本工程
        uses: actions/checkout@v4
        with:
          path: src

      - name: 检出 FoloToy 官方开发基线
        uses: actions/checkout@v4
        with:
          repository: FoloToy/ai-passport
          path: ai-passport

      - name: 用本工程的 main/ 替换官方演示
        run: |
          SRC=src
          if [ -d src/island/main ]; then SRC=src/island; fi
          echo "using sources from $SRC"
          find ai-passport/main -maxdepth 1 -type f \( -name '*.c' -o -name '*.h' -o -name 'CMakeLists.txt' \) -delete
          cp "$SRC"/main/* ai-passport/main/
          ls -la ai-passport/main

      - name: 编译并合并成单个 bin（ESP-IDF v5.5.3，esp32c3）
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          path: ai-passport
          command: idf.py build && idf.py merge-bin -o island-full.bin && idf.py size

      - name: 整理产物
        run: |
          mkdir -p dist
          cp ai-passport/build/island-full.bin dist/
          cp ai-passport/build/flasher_args.json dist/ || true
          ls -la dist

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: island-firmware
          path: dist/
