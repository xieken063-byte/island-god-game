# 自动编译固件：在仓库里找到最近一次上传的代码（任何含 main/sim_world.c 的文件夹），
# 编译成可直接烧录的 island-full.bin。运行完后，在页面底部的 Artifacts 里下载 island-firmware-latest。
name: Build firmware (latest)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出本工程（含历史，用来判断哪份代码最新）
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: 检出 FoloToy 官方开发基线
        uses: actions/checkout@v4
        with:
          repository: FoloToy/ai-passport
          path: ai-passport

      - name: 找到最新上传的代码，替换官方演示
        run: |
          cd src
          best=""; best_t=0
          for f in $(git ls-files | grep -E '(^|/)main/sim_world\.c$'); do
            d=$(dirname "$f")
            t=$(git log -1 --format=%ct -- "$d")
            echo "candidate $d (last changed $(date -d @$t -u +%F_%T))"
            if [ "$t" -gt "$best_t" ]; then best_t=$t; best=$d; fi
          done
          if [ -z "$best" ]; then echo "no main/sim_world.c found"; exit 1; fi
          echo "using $best"
          cd ..
          find ai-passport/main -maxdepth 1 -type f \( -name '*.c' -o -name '*.h' -o -name 'CMakeLists.txt' \) -delete
          cp "src/$best"/* ai-passport/main/
          ls -la ai-passport/main

      - name: 编译并合并成单个 bin（ESP-IDF v5.5.3，esp32c3）
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          path: ai-passport
          command: idf.py build && idf.py merge-bin -o island-full.bin && idf.py size

      - name: 整理产物
        run: |
          mkdir -p dist
          cp ai-passport/build/island-full.bin dist/
          cp ai-passport/build/flasher_args.json di
